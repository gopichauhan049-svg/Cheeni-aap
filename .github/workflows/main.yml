name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libffi-dev \
            python3-dev lld zip unzip
          pip install --upgrade pip
          pip install buildozer cython

      - name: Configure Android SDK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Check Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is missing."
            exit 1
          fi
          echo "Gemini secret is configured."

      - name: Configure Cheeni
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["GEMINI_API_KEY"]

          if not key:
              raise SystemExit("Gemini API Key is empty.")

          escaped = repr(key)

          Path("cheeni_config.py").write_text(
              "GEMINI_API_KEY = " + escaped + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chini-APK
          path: bin/*.apk
          if-no-files-found: error
